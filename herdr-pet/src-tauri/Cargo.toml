[package]
name = "herdr-pet"
version = "0.1.0"
edition = "2021"
description = "Desktop pet companion for Herdr agents"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
interprocess = "2.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = ["macos-private-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSWindow"] }
